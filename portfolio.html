<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mary Kleinschmidt Portfolio</title>
    <link href="style.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="full">
      <header>
        <div class="hStart">
          <a href="index.html" alt="Mary Kleinschmidt page"
            ><img
              id="MK-logo"
              src="MK-logo.png"
              alt="Mary Kleinschmidt logo"
          /></a>
        </div>
        <div class="hMid"><h1>Mary Kleinschmidt</h1></div>
        <div class="hEnd">
          <a href="menu.html" alt="open menu"
            ><img src="plus.png" alt="plus icon"
          /></a>
          <ul>
            <li><a href="about.html" alt="about page">About</a></li>
            <li>
              <a href="portfolio.html" alt="portfolio page">Portfolio</a>
            </li>
            <li><a href="resume.html" alt="resume page">Resume</a></li>
            <li><a href="contact.html" alt="contact page">Contact</a></li>
          </ul>
        </div>
      </header>
      <main>
        <div class="body">
          <div class="portfolioBackground">
            <!-- <img src="images/portfolioBackground.png" alt="Hearts" /> -->
          </div>
          <div class="topPortfolio">
            <h2 class="h2Title">Print Works</h2>
            <div class="carousel">
              <button
                class="carousel-arrow carousel-arrow--prev"
                onclick="handleCarouselMove(false)"
              >
                &#8249;
              </button>

              <button
                class="carousel-arrow carousel-arrow--next"
                onclick="handleCarouselMove()"
              >
                &#8250;
              </button>

              <ul class="carousel-container" dir="ltr">
                <li class="carousel-slide">
                  <img
                    class="pContent"
                    src="chicagoArchitecture-mockup2.jpg"
                    alt="Chicago Architecture Booklet Mockup"
                  />
                </li>
                <li class="carousel-slide">
                  <a
                    href="https://drive.google.com/file/d/15TMMegnOoU_eeWfuWaiIinmlBoMw5R8M/view?usp=sharing"
                    target="_blank"
                    ><img
                      class="pContent"
                      src="02brandingAssignment.jpg"
                      alt="Branding Brief for United Airlines"
                  /></a>
                </li>
                <li class="carousel-slide">
                  <img
                    class="pContent"
                    src="AIWMockup-cmyk.jpg"
                    alt="Alice in Wonderlans Redesign"
                  />
                </li>
                <li class="carousel-slide">
                  <img
                    class="pContent"
                    src="artDeco-display.png"
                    alt="Art Deco Chocolate Packaging Mockups"
                  />
                </li>
                <li class="carousel-slide">
                  <img
                    class="pContent"
                    src="creativeVisions.png"
                    alt="Creative Visions Logo"
                  />
                </li>
                <li class="carousel-slide">
                  <img
                    class="pContent"
                    src="busStop-Mockup.jpg"
                    alt="Marathon Poster"
                  />
                </li>
              </ul>
            </div>
          </div>
          <div class="midPortfolio">
        <h2 class="h2Title">Websites</h2>
        <div class="carousel">
          <button
            class="carousel-arrow2 carousel-arrow2--prev"
            onclick="handleCarouselMove(false)"
          >
            &#8249;
          </button>

          <button
            class="carousel-arrow2 carousel-arrow2--next"
            onclick="handleCarouselMove()"
          >
            &#8250;
          </button>

          <ul class="carousel-container" dir="ltr">
            <li class="carousel-slide">
              <a href="https://mkleinschmidt8993.github.io/BusinessWebsite/">
                <img
                  class="wpContent"
                  src="CURRENT-mainpage.png"
                  alt="Coffee & Tea Business Website Mockup"
                />
              </a>
            </li>
            <li class="carousel-slide">
              <a
                href="https://www.figma.com/design/QuviJjnjmClV2eMjoo4f1M/Untitled?t=PVm7ELIkC0jIo6lh-1"
              >
                <img
                  class="wpContent"
                  src="ekPortfolio.png"
                  alt="Teacher Portfolio Mockup"
                />
              </a>
            </li>
          </ul>
        </div>
      </div>
    <div class="bottomPortfolio">
        <h2 class="h2Title">Animations</h2>
        <div class="carousel">
          <button
            class="carousel-arrow3 carousel-arrow3--prev"
            onclick="handleCarouselMove(false)"
          >
            &#8249;
          </button>

          <button
            class="carousel-arrow3 carousel-arrow3--next"
            onclick="handleCarouselMove()"
          >
            &#8250;
          </button>

          <ul class="carousel-container" dir="ltr">
            <li class="carousel-slide">
              <video
                width="100%"
                height="auto"
                controls="controls"
                class="vpContent"
              >
                <source
                  src="09Rotoscope.mp4"
                  type="video/mp4"
                  alt="Animation of someone running then sliding down a hallway"
                />
              </video>
            </li>
            <li class="carousel-slide">
              <video
                width="100%"
                height="auto"
                controls="controls"
                class="vpContent"
              >
                <source
                  src="Clown.mp4"
                  type="video/mp4"
                  alt="Clown balancing on a ball"
                />
              </video>
            </li>
          </ul>
        </div>
      </div>
      </main>
      <footer>
        <div class="fLine"><p>hidden message</p></div>
        <div class="fLeft">
          <div class="fLeftContent">
            <p>Copyright</p>
            <img src="copyright.png" alt="copyright" />
            <p>2024</p>
          </div>
        </div>
        <div class="fRight">
          <img src="phoneNumber.png" alt="phone number" />
          <img src="email.png" alt="email" />
          <!-- <img src="images/icons/instagram.png" alt="instagram" /> -->
        </div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
